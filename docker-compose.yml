# The service and a real Qdrant beside it.
#
# The application does not need Qdrant to answer: the committed vectors are searched by an
# exact in-process index, which at this corpus size is both faster and exactly right. Qdrant
# is here because the point of `store.py` is to be exercised against the real thing, and
# because `claims-index` shows what changes when the corpus outgrows a flat scan.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # Qdrant's own readiness endpoint, not a port check: a container that is listening but
      # still loading its segments is not ready.
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      CLAIMS_FIXTURES: /app/fixtures
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    read_only: true
    # The process writes nothing. Anything that needs scratch space says so here rather than
    # having the whole filesystem writable in case it does.
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  qdrant-storage:
