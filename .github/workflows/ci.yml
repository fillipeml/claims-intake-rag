name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test, offline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # dev and serve, so the store and the HTTP tests run here rather than skipping. Still
      # no [models]: the job has no GPU and reaches no model hub, which is the claim the
      # README makes about the demo and the tests.
      - run: pip install -e ".[dev,serve]"

      - run: ruff check .

      - run: ruff format --check .

      - run: pytest -q

  corpus:
    name: the corpus is invented, and nothing else got in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The suite computes the CPF check digits and asserts every one is wrong; these greps
      # are the cheaper, blunter version that catches a file arriving from somewhere else.
      - name: No document identifier that belongs to a real scheme
        run: |
          set -e
          if grep -rEn '[0-9]{2}\.[0-9]{3}\.[0-9]{3}/[0-9]{4}-[0-9]{2}' fixtures/; then
            echo "a CNPJ-shaped string is in the fixtures"; exit 1
          fi
          if grep -rEn '[0-9]{7}-[0-9]{2}\.[0-9]{4}\.[0-9]\.[0-9]{2}\.[0-9]{4}' fixtures/; then
            echo "a court case number is in the fixtures"; exit 1
          fi
          echo "ok"

      - name: The rendered pages are not committed
        run: |
          if git ls-files --error-unmatch 'fixtures/pages/*' 2>/dev/null; then
            echo "rendered pages are committed; they are a function of the seed and belong in .gitignore"
            exit 1
          fi
          echo "ok"

  container:
    name: the image builds, starts, and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Building proves it compiles. Running it and asking it a question proves the thing
      # that actually breaks: an entry point that points at a module nobody imported, a
      # corpus that is not in the image, a healthcheck that passes while the app is dead.
      - name: Build
        run: docker build -t claims-intake-rag:ci .

      - name: Start
        run: |
          docker run -d --name claims -p 8000:8000 claims-intake-rag:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "up after ${attempt}s"; exit 0
            fi
            sleep 1
          done
          echo "never became healthy"; docker logs claims; exit 1

      - name: It serves the corpus it was built with
        run: |
          curl -fsS http://127.0.0.1:8000/health | tee health.json
          python3 -c "import json;d=json.load(open('health.json'));assert d['claims']==8,d;assert d['chunks']>200,d"

      - name: It streams an answer as Server-Sent Events
        run: |
          curl -fsS -N -X POST http://127.0.0.1:8000/claims/AV-2026-4407/ask             -H 'content-type: application/json'             -d '{"question":"quanto vai custar o conserto do veículo"}' | tee stream.txt
          grep -q '^event: meta' stream.txt
          grep -q '^event: done' stream.txt
          grep -q 'ttft_ms' stream.txt

      - name: It runs as a non-root user
        run: |
          test "$(docker exec claims id -u)" = "10001"

      - name: Stop
        if: always()
        run: docker rm -f claims || true

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
